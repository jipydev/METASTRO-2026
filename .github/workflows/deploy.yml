name: 🚀 Deploy METASTRO-2026

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Verify preinstalled PHP runtime
        run: |
          php -v
          php -r "if (version_compare(PHP_VERSION, '8.3.0', '<')) { fwrite(STDERR, 'PHP 8.3+ is required. Found: ' . PHP_VERSION . PHP_EOL); exit(1); }"
          composer --version

      - name: 📥 Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 📥 Install Node Dependencies
        run: npm ci

      - name: 🔨 Build Frontend Assets
        run: npm run build

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example
            .env.production
            .editorconfig
            .prettierrc
            phpunit.xml
            phpstan.neon
            pint.json
            tests/**
            .github/**
            *.md
            package.json
            package-lock.json
            pnpm-lock.yaml
            vite.config.js
            postcss.config.js
            tailwind.config.js
            metastro_2026