name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy to Hosting
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Laravel 11 membutuhkan PHP 8.2/8.3

    - name: 📦 Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install NPM & Build Vite Assets
      run: |
        npm install
        npm run build

    - name: 📂 Sync files to cPanel FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: / # Jika FTP diarahkan langsung ke folder project, biarkan /
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env.example
          README.md